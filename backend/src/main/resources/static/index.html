<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CineBook — Pick your seat in the dark</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4efe6;--fg:#1b1713;--mut:#7a6f62;--card:#fffaf0;--line:#d9cfbe;--reg:#4f8a8b;--prem:#c9892b;--vip:#b8325a;--hue:35;--ok:#2f7d4f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a10;--fg:#f3ece0;--mut:#8f8798;--card:#17131d;--line:#2c2536;--reg:#5fb3b3;--prem:#f0b04a;--vip:#ff4d7d;--ok:#6fd69a}}
:root[data-theme="dark"]{--bg:#0c0a10;--fg:#f3ece0;--mut:#8f8798;--card:#17131d;--line:#2c2536;--reg:#5fb3b3;--prem:#f0b04a;--vip:#ff4d7d;--ok:#6fd69a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 'DM Sans',system-ui,sans-serif;min-height:100vh;transition:background .6s}
h1,h2,.bn{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.04em;font-weight:400;margin:0}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px}
.logo{font-size:30px}.logo b{color:var(--vip);font-weight:400}
nav button{background:none;border:1px solid var(--line);color:var(--fg);padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;margin-left:6px}
nav button.on{background:var(--fg);color:var(--bg)}
main{max-width:1060px;margin:0 auto;padding:18px}
.shows{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.show{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;position:relative;overflow:hidden;transition:.25s}
.show:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 100% 0,hsl(var(--h) 80% 55%/.35),transparent 65%)}
.show.on{border-color:hsl(var(--h) 80% 55%);transform:translateY(-3px)}
.show *{position:relative}.show h2{font-size:28px}.show small{color:var(--mut)}
.show .left{font-size:12px;margin-top:8px;display:block}
.stage{margin:26px 0 8px;perspective:700px;text-align:center}
.screen{height:64px;margin:0 auto;width:78%;border-radius:50% 50% 0 0/100% 100% 0 0;border-top:4px solid hsl(var(--hue) 90% 65%);background:linear-gradient(hsl(var(--hue) 90% 60%/.45),transparent);box-shadow:0 -18px 60px hsl(var(--hue) 90% 60%/.5);transform:rotateX(-18deg);transition:.6s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;color:var(--mut);letter-spacing:.4em;font-size:11px}
.layout{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.hall{transform:perspective(900px) rotateX(14deg);transform-origin:top;overflow-x:auto;padding:6px 0 14px}
.row{display:flex;justify-content:center;align-items:center;gap:7px;margin:8px 0}
.row i{font:normal 12px 'DM Sans';width:16px;color:var(--mut);text-align:center}
.aisle{width:22px}
.seat{width:34px;height:32px;border-radius:9px 9px 5px 5px;border:0;cursor:pointer;background:var(--c);opacity:.85;position:relative;transition:.15s;color:transparent;font-size:10px;font-weight:700}
.seat:after{content:"";position:absolute;left:4px;right:4px;bottom:-4px;height:4px;border-radius:0 0 4px 4px;background:var(--c);opacity:.5}
.seat:hover{transform:translateY(-3px);opacity:1}
.seat.sel{opacity:1;color:#111;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c),0 0 22px var(--c);transform:translateY(-4px)}
.seat.x{background:var(--line);opacity:.5;cursor:not-allowed;transform:none}.seat.x:after{background:var(--line)}
.seat.x:before{content:"×";color:var(--mut);position:absolute;inset:0;font-size:16px;line-height:32px}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mut);margin-top:6px}
.legend span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;position:sticky;top:12px}
.panel h2{font-size:26px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px;margin-bottom:10px}
.chip{padding:3px 10px;border-radius:99px;font-weight:700;font-size:13px;background:var(--c);color:#111}
.ln{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut)}
.ln.t{color:var(--fg);font-size:20px;font-weight:700;border-top:1px dashed var(--line);margin-top:6px;padding-top:8px}
input[type=text]{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;margin:8px 0}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.pay button{padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer;font:inherit}
.pay button.on{border-color:var(--vip);box-shadow:inset 0 0 0 1px var(--vip)}
.cta{width:100%;padding:13px;border:0;border-radius:12px;background:var(--vip);color:#fff;font:700 15px 'DM Sans';cursor:pointer;margin-top:8px}
.cta:disabled{opacity:.35;cursor:not-allowed}
.msg{font-size:13px;min-height:18px;color:var(--prem)}
.gp{display:none;border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;margin-top:6px}
.tk{display:flex;margin:14px 0;filter:drop-shadow(0 6px 14px rgb(0 0 0/.25));transition:.7s}
.tk .main,.tk .stub{background:var(--card);border:1px solid var(--line);padding:16px 20px}
.tk .main{flex:1;border-radius:14px 0 0 14px;border-right:2px dashed var(--line);position:relative;border-top:5px solid hsl(var(--h) 80% 55%)}
.tk .stub{width:130px;border-radius:0 14px 14px 0;text-align:center;transform-origin:left bottom;transition:.8s;display:flex;flex-direction:column;justify-content:center;border-top:5px solid hsl(var(--h) 80% 55%)}
.tk h2{font-size:30px}.tk small{color:var(--mut)}
.tk.void .stub{transform:rotate(14deg) translate(16px,26px);opacity:.45}
.tk.void .main{opacity:.6}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:11px;font-weight:700;background:var(--ok);color:#fff}
.tk.void .badge{background:var(--vip)}
.bars{height:28px;margin-top:8px;background:repeating-linear-gradient(90deg,var(--fg) 0 2px,transparent 2px 4px,var(--fg) 4px 5px,transparent 5px 9px);opacity:.75}
.link{background:none;border:1px solid var(--vip);color:var(--vip);border-radius:8px;padding:5px 12px;cursor:pointer;font:inherit;margin-top:8px}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.pop{position:fixed;inset:0;background:rgb(0 0 0/.7);display:none;align-items:center;justify-content:center;z-index:9;padding:16px}
.pop.on{display:flex}.pop>div{max-width:560px;width:100%;animation:up .5s}
@keyframes up{from{transform:translateY(40px) scale(.95);opacity:0}}
.pop .cta{max-width:200px;display:block;margin:0 auto}
</style>
</head>
<body>
<header>
  <div class="logo bn">CINE<b>BOOK</b></div>
  <nav><button id="t1" class="on">Book</button><button id="t2">My Tickets</button></nav>
</header>
<main>
  <section id="v1">
    <div class="shows" id="shows"></div>
    <div class="stage"><div class="screen" id="screen">SCREEN</div></div>
    <div class="layout">
      <div>
        <div class="hall" id="hall"></div>
        <div class="legend">
          <span style="--c:var(--reg)">Regular ₹150</span><span style="--c:var(--prem)">Premium ₹250</span><span style="--c:var(--vip)">VIP ₹400</span><span style="--c:var(--line)">Taken</span>
        </div>
      </div>
      <aside class="panel">
        <h2>Your seats</h2>
        <div class="chips" id="chips"></div>
        <div class="ln"><span>Subtotal</span><span id="sub">₹0</span></div>
        <div class="ln"><span>Discount</span><span id="dis">₹0</span></div>
        <div class="ln t"><span>Total</span><span id="tot">₹0</span></div>
        <input type="text" id="cp" placeholder="Coupon (try CINE10)">
        <div class="pay"><button id="p1" class="on">Google Pay</button><button id="p2">Cash</button></div>
        <div class="gp" id="gp">Pay in your GPay app, then confirm below to simulate it.<br><label><input type="checkbox" id="gc"> I’ve completed the payment</label></div>
        <div class="msg" id="msg"></div>
        <button class="cta" id="go" disabled>Confirm booking</button>
      </aside>
    </div>
  </section>
  <section id="v2" style="display:none"><div id="list"></div></section>
</main>
<div class="pop" id="pop"><div><div id="popt"></div><button class="cta" id="pc">Done</button></div></div>

<script>
const TYPES=[["REGULAR",150,"--reg"],["REGULAR",150,"--reg"],["PREMIUM",250,"--prem"],["PREMIUM",250,"--prem"],["VIP",400,"--vip"]];
let SHOWS=[],BOOKINGS=[],cur=0,sel=[],pay="Google Pay";
const $=id=>document.getElementById(id);
const inr=n=>"₹"+(Math.round(n*100)/100).toLocaleString("en-IN");

async function api(p,o={}){
  const r=await fetch("/api"+p,{headers:{"Content-Type":"application/json"},...o});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.message||"Request failed");
  return d;
}
async function refresh(){
  try{SHOWS=await api("/shows");BOOKINGS=await api("/bookings")}
  catch(e){$("msg").textContent="Can't reach server: "+e.message;return}
  if(cur>=SHOWS.length)cur=0;
  drawShows();drawHall();summary();
  if($("v2").style.display!="none")drawList();
}
function drawShows(){
  if(!SHOWS.length)return;
  $("shows").innerHTML=SHOWS.map((s,i)=>`<button class="show ${i==cur?"on":""}" style="--h:${s.hue}" data-i="${i}"><small>${s.time}</small><h2>${s.movie}</h2><span class="left">${40-s.taken.length} of 40 seats free</span></button>`).join("");
  $("screen").style.setProperty("--hue",SHOWS[cur].hue);
  document.body.style.setProperty("--hue",SHOWS[cur].hue);
}
function drawHall(){
  const taken=SHOWS[cur]?SHOWS[cur].taken:[];
  let h="";
  for(let r=0;r<5;r++){
    const L=String.fromCharCode(65+r);let row=`<div class="row"><i>${L}</i>`;
    for(let c=1;c<=8;c++){
      const id=L+c,x=taken.includes(id),on=sel.includes(id);
      row+=`<button class="seat ${x?"x":""} ${on?"sel":""}" style="--c:var(${TYPES[r][2]})" data-s="${id}" ${x?"disabled":""} title="${id} · ${TYPES[r][0]} ${inr(TYPES[r][1])}">${c}</button>`;
      if(c==4)row+=`<span class="aisle"></span>`;
    }
    h+=row+`<i>${L}</i></div>`;
  }
  $("hall").innerHTML=h;
}
const price=id=>TYPES[id.charCodeAt(0)-65][1];
function calc(){
  const sub=sel.reduce((a,s)=>a+price(s),0);
  const code=$("cp").value.trim().toUpperCase();
  const dis=code=="CINE10"?sub*.1:0;
  return{sub,dis,tot:sub-dis,code};
}
function summary(){
  const c=calc();
  $("chips").innerHTML=sel.length?sel.map(s=>`<span class="chip" style="--c:var(${TYPES[s.charCodeAt(0)-65][2]})">${s}</span>`).join(""):'<span style="color:var(--mut)">Tap seats to select</span>';
  $("sub").textContent=inr(c.sub);$("dis").textContent="− "+inr(c.dis);$("tot").textContent=inr(c.tot);
  $("msg").textContent=c.code&&c.code!="CINE10"?"Invalid coupon — no discount applied.":(c.dis?"CINE10 applied: 10% off 🎉":"");
  $("gp").style.display=pay=="Google Pay"?"block":"none";
  $("go").disabled=!sel.length||(pay=="Google Pay"&&!$("gc").checked);
}
function ticket(b,withBtn){
  const void_=b.status=="CANCELLED";
  return`<div class="tk ${void_?"void":""}" id="tk${b.id}" style="--h:${b.hue}">
  <div class="main"><small>BOOKING BK${b.id}</small><h2>${b.movie}</h2>
  <div>${b.showTime} · Seats <b>${b.seats.join(", ")}</b></div>
  <small>${b.paymentMethod} · Paid ${inr(b.amount)}${b.coupon?" · coupon "+b.coupon:""}${void_?` · Refund ${inr(b.refund)} (80%), ${inr(b.amount-b.refund)} retained`:""}</small>
  <div class="bars"></div>
  ${withBtn&&!void_?`<br><button class="link" data-c="${b.id}">Cancel &amp; tear ticket</button>`:""}</div>
  <div class="stub"><span class="badge">${b.status}</span><div class="bn" style="font-size:26px;margin-top:6px">${b.seats.length}×</div><small>ADMIT</small></div></div>`;
}
function drawList(){
  $("list").innerHTML=BOOKINGS.length?BOOKINGS.map(b=>ticket(b,true)).join(""):'<div class="empty"><h2>No tickets yet</h2>Your bookings will appear here as tickets.</div>';
}
async function book(){
  const c=calc();
  if(!sel.length)return;
  $("go").disabled=true;
  try{
    const b=await api("/bookings",{method:"POST",body:JSON.stringify({showId:SHOWS[cur].id,seats:sel,coupon:c.code,payment:pay,paymentConfirmed:$("gc").checked})});
    sel=[];$("gc").checked=false;await refresh();
    $("popt").innerHTML=`<h2 style="text-align:center;color:#fff;font-size:34px">Booking confirmed</h2>`+ticket(b,false);
    $("pop").classList.add("on");
  }catch(e){
    await refresh();
    sel=sel.filter(s=>!SHOWS[cur].taken.includes(s));drawHall();summary();
    $("msg").textContent=e.message;
  }
}
async function cancel(id){
  try{
    await api("/bookings/"+id+"/cancel",{method:"POST"});
    const el=$("tk"+id);if(el)el.classList.add("void");
    setTimeout(refresh,900);
  }catch(e){alert(e.message)}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-i],[data-s],[data-c]");
  if(t&&t.dataset.i!==undefined){cur=+t.dataset.i;sel=[];drawShows();drawHall();summary()}
  else if(t&&t.dataset.s){const s=t.dataset.s;sel=sel.includes(s)?sel.filter(x=>x!=s):[...sel,s];drawHall();summary()}
  else if(t&&t.dataset.c)cancel(t.dataset.c);
});
$("cp").oninput=summary;$("gc").onchange=summary;$("go").onclick=book;
$("p1").onclick=()=>{pay="Google Pay";$("p1").className="on";$("p2").className="";summary()};
$("p2").onclick=()=>{pay="Cash";$("p2").className="on";$("p1").className="";summary()};
$("pc").onclick=()=>$("pop").classList.remove("on");
function tab(n){$("v1").style.display=n==1?"":"none";$("v2").style.display=n==2?"":"none";$("t1").className=n==1?"on":"";$("t2").className=n==2?"on":"";if(n==2)drawList()}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
summary();refresh();
</script>
</body>
</html>
